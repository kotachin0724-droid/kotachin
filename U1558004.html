<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA — 精品選物店</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Plus Jakarta Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f8f6f0',
                            100: '#efebd9',
                            800: '#2c2a29',
                            900: '#1a1918',
                            accent: '#d4af37', // 質感金
                            accentHover: '#b89528'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* 全局平滑滾動與字體設置 */
        body {
            background-color: #fbfb9;
            color: #1a1918;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* 脈衝衝擊波效果 (Ripple Effect) */
        .ripple-btn {
            position: relative;
            overflow: hidden;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* 飛入購物車動畫元素樣式 */
        .flying-item {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }

        /* Canvas 粒子特效覆蓋層 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
        }

        /* 購物車圖示震動與徽章縮放動畫 */
        @keyframes cart-bounce {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.2) rotate(-12deg); }
            40% { transform: scale(1.2) rotate(12deg); }
            60% { transform: scale(1.1) rotate(-6deg); }
            80% { transform: scale(1.05) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .cart-animate {
            animation: cart-bounce 0.6s ease-in-out;
        }

        @keyframes badge-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
        .badge-animate {
            animation: badge-pop 0.4s ease-out;
        }

        /* 毛玻璃側滑欄 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* 卡片懸停光澤 */
        .product-card {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.08);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body class="bg-[#faf9f6] text-brand-900 antialiased selection:bg-brand-accent selection:text-white">

    <!-- 粒子特效 Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Brand Logo -->
            <a href="#" class="flex items-center gap-2 group">
                <span class="font-serif text-3xl font-semibold tracking-wider text-brand-900 group-hover:text-brand-accent transition-colors">AURA</span>
                <span class="w-1.5 h-1.5 rounded-full bg-brand-accent"></span>
            </a>

            <!-- Navigation Links (Desktop) -->
            <nav class="hidden md:flex items-center space-x-10 text-sm font-medium tracking-widest uppercase text-gray-600">
                <a href="#products" class="hover:text-brand-900 transition-colors">新品上市</a>
                <a href="#products" class="hover:text-brand-900 transition-colors">熱銷推薦</a>
                <a href="#about" class="hover:text-brand-900 transition-colors">品牌故事</a>
            </nav>

            <!-- Cart Icon Button -->
            <button id="cart-btn" class="relative p-3 rounded-full hover:bg-gray-100 transition-all duration-300 focus:outline-none" aria-label="Shopping Cart">
                <i class="fa-solid fa-bag-shopping text-xl text-brand-900"></i>
                <!-- Notification Badge -->
                <span id="cart-badge" class="absolute top-1 right-1 bg-brand-accent text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center scale-0 transition-transform duration-300 shadow-sm">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="relative overflow-hidden bg-brand-50 py-16 sm:py-24 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
            <span class="text-xs uppercase tracking-[0.3em] text-brand-accent font-semibold mb-3 block">Autumn / Winter Collection</span>
            <h1 class="font-serif text-4xl sm:text-6xl font-normal text-brand-900 mb-6 leading-tight">沉澱極致美學，細琢奢華生活</h1>
            <p class="max-w-xl mx-auto text-gray-600 text-sm sm:text-base leading-relaxed font-light mb-8">
                探索為品味生活打造的極簡選品，融合簡約設計與無可挑剔的工藝質感。
            </p>
            <a href="#products" class="inline-block bg-brand-900 text-white text-xs uppercase tracking-widest px-8 py-4 rounded-full hover:bg-brand-accent transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-0.5">
                探索商品列表
            </a>
        </div>
    </section>

    <!-- Main Content / Product Grid Section -->
    <main id="products" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-24">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-12">
            <div>
                <h2 class="font-serif text-3xl sm:text-4xl text-brand-900 font-normal">精選商品</h2>
                <p class="text-gray-500 text-sm mt-2">精挑細選的現代美學生活提案</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-2">
                <button class="px-4 py-2 text-xs rounded-full bg-brand-900 text-white font-medium">全部</button>
                <button class="px-4 py-2 text-xs rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition">居家配件</button>
                <button class="px-4 py-2 text-xs rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition">香氛系列</button>
            </div>
        </div>

        <!-- Product Grid (Responsive Grid) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 sm:gap-10" id="product-grid">
            <!-- Dynamic products populated by JS -->
        </div>
    </main>

    <!-- Side Cart Drawer Overlay & Panel -->
    <div id="cart-drawer-backdrop" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
    <aside id="cart-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[420px] glass-panel z-50 translate-x-full transition-transform duration-500 ease-out flex flex-col shadow-2xl border-l border-white/20">
        <!-- Cart Header -->
        <div class="p-6 border-b border-gray-200/60 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-bag-shopping text-brand-900"></i>
                <h3 class="font-serif text-xl font-medium text-brand-900">購物清單</h3>
                <span id="drawer-count" class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-medium">(0)</span>
            </div>
            <button id="close-drawer" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-gray-200/60 text-gray-500 transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Cart Items List Container -->
        <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Empty State -->
            <div id="empty-cart-msg" class="h-full flex flex-col items-center justify-center text-center py-12">
                <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 mb-4">
                    <i class="fa-solid fa-basket-shopping text-2xl"></i>
                </div>
                <p class="text-brand-900 font-medium mb-1">您的購物車目前是空的</p>
                <p class="text-gray-400 text-xs mb-6">趕快挑選心儀的商品加入吧！</p>
                <button id="start-shopping" class="text-xs uppercase tracking-wider text-brand-accent font-semibold hover:underline">開始購物 &rarr;</button>
            </div>
        </div>

        <!-- Cart Footer / Summary -->
        <div class="p-6 border-t border-gray-200/60 bg-white/50 space-y-4">
            <div class="space-y-2 text-sm">
                <div class="flex justify-between text-gray-500">
                    <span>商品小計</span>
                    <span id="subtotal-price">NT$ 0</span>
                </div>
                <div class="flex justify-between text-gray-500">
                    <span>運費估計</span>
                    <span class="text-emerald-600 font-medium">免運費</span>
                </div>
                <div class="pt-2 border-t border-gray-200/60 flex justify-between font-semibold text-lg text-brand-900">
                    <span>總計金額</span>
                    <span id="total-price" class="text-brand-accent">NT$ 0</span>
                </div>
            </div>

            <button id="checkout-btn" class="ripple-btn w-full py-4 bg-brand-900 hover:bg-brand-accent text-white font-medium text-xs uppercase tracking-widest rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2 group">
                <span>前往結帳</span>
                <i class="fa-solid fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
            </button>
        </div>
    </aside>

    <!-- Toast Notification Message -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-brand-900 text-white px-6 py-3 rounded-full text-xs font-medium shadow-2xl transition-all duration-300 opacity-0 translate-y-8 pointer-events-none flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-brand-accent text-sm"></i>
        <span id="toast-message">商品已成功加入購物車</span>
    </div>

    <!-- Footer -->
    <footer class="bg-brand-900 text-white py-12 border-t border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-gray-400 space-y-4">
            <p class="font-serif text-xl text-white">AURA</p>
            <p>© 2026 AURA Studio. All rights reserved. 極簡高品質選物體驗。</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- 1. 商品資料庫 (Mock Data) ---
        const products = [
            {
                id: 1,
                name: '極簡北歐有機陶瓷花瓶',
                category: '居家配件',
                price: 2480,
                image: 'https://images.unsplash.com/photo-1612196808214-b7e239e5f6b7?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 2,
                name: '手工調製雪松大地香氛蠟燭',
                category: '香氛系列',
                price: 1680,
                image: 'https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 3,
                name: '黃銅現代風格檯燈',
                category: '居家配件',
                price: 4900,
                image: 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 4,
                name: '日式極簡磨砂陶瓷茶具組',
                category: '居家配件',
                price: 3200,
                image: 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 5,
                name: '天然冷杉與橙花手部洗沐禮盒',
                category: '香氛系列',
                price: 1980,
                image: 'https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 6,
                name: '亞麻質感休閒舒眠披毯',
                category: '居家配件',
                price: 2880,
                image: 'https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&w=800&q=80'
            }
        ];

        // 購物車狀態
        let cart = [];

        // DOM 元素引用
        const productGrid = document.getElementById('product-grid');
        const cartBtn = document.getElementById('cart-btn');
        const cartBadge = document.getElementById('cart-badge');
        const cartDrawer = document.getElementById('cart-drawer');
        const cartDrawerBackdrop = document.getElementById('cart-drawer-backdrop');
        const closeDrawerBtn = document.getElementById('close-drawer');
        const cartItemsContainer = document.getElementById('cart-items-container');
        const emptyCartMsg = document.getElementById('empty-cart-msg');
        const subtotalPriceEl = document.getElementById('subtotal-price');
        const totalPriceEl = document.getElementById('total-price');
        const drawerCountEl = document.getElementById('drawer-count');
        const startShoppingBtn = document.getElementById('start-shopping');
        const checkoutBtn = document.getElementById('checkout-btn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // --- 2. 初始化渲染商品列表 ---
        function renderProducts() {
            productGrid.innerHTML = products.map(product => `
                <div class="product-card bg-white rounded-2xl overflow-hidden border border-gray-100 flex flex-col justify-between group">
                    <div class="relative overflow-hidden aspect-square bg-gray-50">
                        <img src="${product.image}" alt="${product.name}" id="product-img-${product.id}" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out">
                        <span class="absolute top-4 left-4 bg-white/90 backdrop-blur-md text-[10px] uppercase tracking-widest font-semibold px-3 py-1 rounded-full text-brand-900 shadow-sm">
                            ${product.category}
                        </span>
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-serif text-lg font-medium text-brand-900 mb-2 group-hover:text-brand-accent transition-colors">${product.name}</h3>
                            <p class="text-sm font-semibold text-gray-900 mb-6">NT$ ${product.price.toLocaleString()}</p>
                        </div>
                        <button onclick="addToCart(${product.id}, event)" class="ripple-btn w-full py-3.5 bg-brand-50 hover:bg-brand-900 text-brand-900 hover:text-white rounded-xl text-xs font-semibold tracking-wider uppercase transition-all duration-300 flex items-center justify-center gap-2 border border-gray-200/80 hover:border-transparent">
                            <i class="fa-solid fa-plus text-xs"></i>
                            <span>加入購物車</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- 3. 購物車邏輯與動畫觸發 ---
        function addToCart(productId, event) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            // 新增至購物車陣列
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            // 觸發視覺效果：衝擊波、飛入動畫、粒子爆發
            createRipple(event);
            animateFlyToCart(productId, event);

            // 更新 UI
            updateCartUI();
        }

        // 更新購物車清單與數字
        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            // Badge 數字與動畫
            cartBadge.innerText = totalCount;
            drawerCountEl.innerText = `(${totalCount})`;

            if (totalCount > 0) {
                cartBadge.classList.remove('scale-0');
                cartBadge.classList.add('scale-100', 'badge-animate');
                setTimeout(() => cartBadge.classList.remove('badge-animate'), 400);
            } else {
                cartBadge.classList.remove('scale-100');
                cartBadge.classList.add('scale-0');
            }

            // 金額更新
            subtotalPriceEl.innerText = `NT$ ${totalPrice.toLocaleString()}`;
            totalPriceEl.innerText = `NT$ ${totalPrice.toLocaleString()}`;

            // 購物車內容繪製
            if (cart.length === 0) {
                emptyCartMsg.style.display = 'flex';
                cartItemsContainer.innerHTML = '';
                cartItemsContainer.appendChild(emptyCartMsg);
            } else {
                emptyCartMsg.style.display = 'none';
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="flex items-center gap-4 py-4 border-b border-gray-100 last:border-0">
                        <img src="${item.image}" alt="${item.name}" class="w-16 h-16 rounded-xl object-cover bg-gray-50 flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-medium text-brand-900 truncate">${item.name}</h4>
                            <p class="text-xs text-gray-500 mt-1">NT$ ${item.price.toLocaleString()}</p>
                            <div class="flex items-center gap-3 mt-2">
                                <div class="flex items-center border border-gray-200 rounded-lg bg-white overflow-hidden">
                                    <button onclick="changeQuantity(${item.id}, -1)" class="w-7 h-7 flex items-center justify-center hover:bg-gray-100 text-xs text-gray-600 transition">-</button>
                                    <span class="px-2 text-xs font-semibold text-brand-900">${item.quantity}</span>
                                    <button onclick="changeQuantity(${item.id}, 1)" class="w-7 h-7 flex items-center justify-center hover:bg-gray-100 text-xs text-gray-600 transition">+</button>
                                </div>
                                <button onclick="removeFromCart(${item.id})" class="text-xs text-red-400 hover:text-red-600 transition">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-semibold text-brand-900">NT$ ${(item.price * item.quantity).toLocaleString()}</span>
                        </div>
                    </div>
                `).join('');
            }
        }

        // 調整數量
        function changeQuantity(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(id);
                } else {
                    updateCartUI();
                }
            }
        }

        // 刪除項目
        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
            showToast("已從購物車移除商品");
        }

        // --- 4. 炫酷飛入購物車動畫 + 粒子散落特效 ---
        function animateFlyToCart(productId, event) {
            const productImg = document.getElementById(`product-img-${productId}`);
            const cartIcon = cartBtn;

            if (!productImg || !cartIcon) return;

            const imgRect = productImg.getBoundingClientRect();
            const cartRect = cartIcon.getBoundingClientRect();

            // 複製一個圖片節點進行飛入
            const flyingImg = document.createElement('img');
            flyingImg.src = productImg.src;
            flyingImg.className = 'flying-item';
            flyingImg.style.left = `${imgRect.left}px`;
            flyingImg.style.top = `${imgRect.top}px`;
            flyingImg.style.width = `${imgRect.width}px`;
            flyingImg.style.height = `${imgRect.height}px`;

            document.body.appendChild(flyingImg);

            // 起始位置點的粒子爆發
            const startX = event.clientX || (imgRect.left + imgRect.width / 2);
            const startY = event.clientY || (imgRect.top + imgRect.height / 2);
            spawnParticles(startX, startY, 18, '#d4af37');

            // 執行平滑飛入動畫
            requestAnimationFrame(() => {
                flyingImg.style.left = `${cartRect.left + cartRect.width / 2 - 20}px`;
                flyingImg.style.top = `${cartRect.top + cartRect.height / 2 - 20}px`;
                flyingImg.style.width = '40px';
                flyingImg.style.height = '40px';
                flyingImg.style.opacity = '0.4';
                flyingImg.style.transform = 'scale(0.3) rotate(360deg)';
            });

            // 飛抵目的地後觸發效果
            setTimeout(() => {
                flyingImg.remove();
                
                // 購物車圖示震動
                cartIcon.classList.add('cart-animate');
                setTimeout(() => cartIcon.classList.remove('cart-animate'), 600);

                // 購物車位置粒子綻放
                spawnParticles(cartRect.left + cartRect.width / 2, cartRect.top + cartRect.height / 2, 25, '#d4af37');

                showToast("成功加入購物車！");
            }, 800);
        }

        // --- 5. 按鈕水波紋 / 衝擊波效果 (Ripple) ---
        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement('span');
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;

            const rect = button.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            const ripple = button.getElementsByClassName('ripple')[0];
            if (ripple) {
                ripple.remove();
            }

            button.appendChild(circle);
        }

        // --- 6. Canvas 粒子引擎 ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                // 隨機角度與速度
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 4 + 2;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.gravity = 0.15; // 輕微重力
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.vx *= 0.96; // 阻力
                this.vy *= 0.96;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnParticles(x, y, count = 20, color = '#d4af37') {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // --- 7. Toast 提示訊息 ---
        let toastTimeout;
        function showToast(msg) {
            toastMessage.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-8', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-8', 'pointer-events-none');
            }, 2500);
        }

        // --- 8. 側滑購物車選單開關 ---
        function openDrawer() {
            cartDrawer.classList.remove('translate-x-full');
            cartDrawerBackdrop.classList.remove('opacity-0', 'pointer-events-none');
            cartDrawerBackdrop.classList.add('opacity-100');
        }

        function closeDrawer() {
            cartDrawer.classList.add('translate-x-full');
            cartDrawerBackdrop.classList.remove('opacity-100');
            cartDrawerBackdrop.classList.add('opacity-0', 'pointer-events-none');
        }

        cartBtn.addEventListener('click', openDrawer);
        closeDrawerBtn.addEventListener('click', closeDrawer);
        cartDrawerBackdrop.addEventListener('click', closeDrawer);
        if (startShoppingBtn) startShoppingBtn.addEventListener('click', closeDrawer);

        // 結帳按鈕慶祝動畫
        checkoutBtn.addEventListener('click', (e) => {
            if (cart.length === 0) {
                showToast("購物車內沒有商品！");
                return;
            }
            const rect = checkoutBtn.getBoundingClientRect();
            spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 60, '#d4af37');
            showToast("感謝您的訂購！訂單處理中...");
            cart = [];
            updateCartUI();
            setTimeout(closeDrawer, 1200);
        });

        // 頁面加載初始化
        window.onload = function() {
            renderProducts();
            updateCartUI();
        };
    </script>
</body>
</html>
