<!DOCTYPE html>
  <html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-X // 未來科技購物平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              orbitron: ['Orbitron', 'sans-serif'],
              noto: ['Noto Sans TC', 'sans-serif']
            },
            colors: {
              neon: {
                cyan: '#00f3ff',
                pink: '#ff0055',
                purple: '#b000ff',
                yellow: '#ffe600',
                bg: '#0a0d14',
                card: 'rgba(18, 24, 38, 0.75)'
              }
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #06080d;
        color: #e2e8f0;
        font-family: 'Noto Sans TC', 'Orbitron', sans-serif;
        overflow-x: hidden;
      }

      /* Cyber Background Glow Grid */
      .bg-grid {
        background-image: linear-gradient(to right, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      /* Glowing Text Effects */
      .text-glow-cyan {
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.6), 0 0 20px rgba(0, 243, 255, 0.3);
      }
      .text-glow-pink {
        text-shadow: 0 0 10px rgba(255, 0, 85, 0.6), 0 0 20px rgba(255, 0, 85, 0.3);
      }

      /* Glassmorphism Card Style */
      .glass-card {
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 243, 255, 0.15);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .glass-card:hover {
        border-color: rgba(0, 243, 255, 0.5);
        box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.1);
        transform: translateY(-6px);
      }

      /* Particle Canvas Overlay */
      #particle-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9999;
      }

      /* Flying Item Dynamic Glow Element */
      .flying-energy-ball {
        position: fixed;
        z-index: 10000;
        pointer-events: none;
        border-radius: 50%;
        background: radial-gradient(circle, #00f3ff 0%, #ff0055 70%, transparent 100%);
        box-shadow: 0 0 20px #00f3ff, 0 0 35px #ff0055, 0 0 50px #b000ff;
        transition: transform 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.8s ease;
      }

      /* Animations */
      @keyframes cartWobble {
        0% { transform: scale(1) rotate(0deg); }
        15% { transform: scale(1.3) rotate(-15deg); }
        30% { transform: scale(1.3) rotate(15deg); }
        45% { transform: scale(1.2) rotate(-10deg); }
        60% { transform: scale(1.2) rotate(10deg); }
        75% { transform: scale(1.1) rotate(-5deg); }
        100% { transform: scale(1) rotate(0deg); }
      }

      .animate-cart-bounce {
        animation: cartWobble 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      }

      @keyframes pulseGlow {
        0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.7); }
        70% { box-shadow: 0 0 0 18px rgba(0, 243, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
      }

      .btn-pulse {
        animation: pulseGlow 0.6s ease-out;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #06080d;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f3ff;
      }
    </style>
  </head>
  <body class="relative min-h-screen bg-grid">

    <!-- Particle Explosion Canvas Overlay -->
    <canvas id="particle-canvas"></canvas>

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-cyan-500/20">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        
        <!-- Brand Logo -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-400 to-pink-500 flex items-center justify-center shadow-lg shadow-cyan-500/30">
            <i class="fa-solid fa-bolt text-slate-950 text-xl font-black"></i>
          </div>
          <span class="font-orbitron font-extrabold text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 text-glow-cyan">
            CYBER<span class="text-white">-X</span>
          </span>
        </div>

        <!-- Search Bar -->
        <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
          <input type="text" id="search-input" placeholder="搜尋未來裝備、黑科技產品..." 
                class="w-full bg-slate-900/80 text-cyan-100 placeholder-slate-500 px-4 py-2.5 pl-11 rounded-full border border-cyan-500/30 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 text-sm transition">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
        </div>

        <!-- Action Area (Cart Button) -->
        <div class="flex items-center space-x-4">
          <button id="cart-icon-btn" onclick="toggleCartDrawer()" class="relative p-3 rounded-xl bg-slate-900/80 border border-cyan-500/30 hover:border-cyan-400 text-cyan-400 hover:text-white transition duration-200">
            <i class="fa-solid fa-cart-shopping text-xl"></i>
            <!-- Badge -->
            <span id="cart-badge" class="absolute -top-2 -right-2 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-xs w-6 h-6 rounded-full flex items-center justify-center shadow-lg shadow-pink-500/50 scale-0 transition-transform duration-300">
              0
            </span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      
      <!-- Hero Banner -->
      <section class="relative rounded-3xl overflow-hidden mb-12 border border-cyan-500/30 bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 p-8 md:p-12">
        <div class="absolute -right-10 -bottom-10 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute right-1/3 -top-10 w-80 h-80 bg-pink-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="relative z-10 max-w-2xl">
          <span class="inline-block px-3 py-1 rounded-full text-xs font-orbitron bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 mb-4 tracking-widest uppercase">
            NEON EVOLUTION 2026
          </span>
          <h1 class="text-3xl md:text-5xl font-black font-orbitron tracking-wide text-white leading-tight mb-4">
            探索次世代 <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 text-glow-cyan"> cyberpunk 賽博裝備</span>
          </h1>
          <p class="text-slate-400 text-sm md:text-base mb-6 leading-relaxed">
            搭載極速量子傳輸與光學隱形技術，點擊加入購物車體驗沉浸式粒子視覺衝擊。
          </p>
        </div>
      </section>

      <!-- Filter & Category Section -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <!-- Category Buttons -->
        <div class="flex flex-wrap gap-2" id="category-filters">
          <!-- Dynamic Category Generation -->
        </div>
        <!-- Mobile Search Field -->
        <div class="md:hidden relative w-full">
          <input type="text" id="mobile-search-input" placeholder="搜尋裝備..." 
                class="w-full bg-slate-900 text-cyan-100 placeholder-slate-500 px-4 py-2 pl-10 rounded-lg border border-cyan-500/30 focus:outline-none focus:border-cyan-400 text-sm">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
        </div>
      </div>

      <!-- Product Grid Showcase -->
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Dynamic Products Inserted via JS -->
      </div>
    </main>

    <!-- Cart Sidebar Drawer Overlay -->
    <div id="cart-drawer-backdrop" onclick="toggleCartDrawer()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <!-- Cart Drawer -->
    <aside id="cart-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-slate-900 border-l border-cyan-500/30 z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
      <!-- Drawer Header -->
      <div class="p-6 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-bag-shopping text-cyan-400 text-xl"></i>
          <h2 class="font-orbitron font-bold text-lg text-white tracking-wider">量子儲存倉 (購物車)</h2>
        </div>
        <button onclick="toggleCartDrawer()" class="text-slate-400 hover:text-cyan-400 transition">
          <i class="fa-solid fa-xmark text-2xl"></i>
        </button>
      </div>

      <!-- Cart Items Scroll Area -->
      <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4">
        <!-- Dynamic Cart Items -->
      </div>

      <!-- Drawer Footer -->
      <div class="p-6 border-t border-slate-800 bg-slate-950/80 space-y-4">
        <div class="space-y-2 text-sm">
          <div class="flex justify-between text-slate-400">
            <span>小計</span>
            <span id="cart-subtotal" class="font-orbitron text-white">NT$ 0</span>
          </div>
          <div class="flex justify-between text-slate-400">
            <span>能量稅與運費</span>
            <span class="text-cyan-400 font-orbitron">免費 (FREE)</span>
          </div>
          <div class="border-t border-slate-800 pt-2 flex justify-between font-bold text-lg">
            <span class="text-white">總計額</span>
            <span id="cart-total" class="font-orbitron text-cyan-400 text-glow-cyan">NT$ 0</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button onclick="clearCart()" class="py-3 px-4 rounded-xl border border-rose-500/30 text-rose-400 hover:bg-rose-500/10 font-medium text-sm transition">
            清空倉庫
          </button>
          <button onclick="triggerCheckout()" class="py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-500 hover:opacity-90 text-white font-orbitron font-bold text-sm tracking-wider shadow-lg shadow-cyan-500/20 transition">
            立即結帳 <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>

    </aside>

    <!-- Quick Preview Modal -->
    <div id="product-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
      <div class="bg-slate-900 border border-cyan-500/40 rounded-3xl max-w-2xl w-full p-6 md:p-8 relative shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
        <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-body">
          <!-- Dynamic Product Details -->
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

    <!-- JavaScript Logic & Particle FX System -->
    <script>
      // --- Product Database ---
      const products = [
        {
          id: 'p1',
          name: 'Cyber-VR 賽博全息眼鏡 X1',
          category: 'gadgets',
          categoryName: '黑科技裝備',
          price: 24900,
          rating: 4.9,
          tag: '熱銷 TOP 1',
          image: 'https://images.unsplash.com/photo-1593508512255-86ab42a8e620?auto=format&fit=crop&w=600&q=80',
          description: '搭載量子光學顯示系統與神經元直接連接傳感器，帶來超越現實的無縫 8K 全息沉浸體驗。'
        },
        {
          id: 'p2',
          name: 'NeoGlow 霓虹外骨骼戰甲',
          category: 'cyberwear',
          categoryName: '賽博穿戴',
          price: 88000,
          rating: 5.0,
          tag: '極限限定',
          image: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80',
          description: '輕量化碳纖維配備 RGB 可調動態燈效，提升 300% 機動性能與高抗衝擊防禦層。'
        },
        {
          id: 'p3',
          name: 'Quantum-Sound 骨傳導耳機',
          category: 'electronics',
          categoryName: '未來電子',
          price: 8900,
          rating: 4.7,
          tag: '新品上市',
          image: 'https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=600&q=80',
          description: '採用相位消除防漏音技術，提供次世代的主動降噪與 7.1 環繞立體聲場。'
        },
        {
          id: 'p4',
          name: 'Vaporwave 脈衝機械鍵盤',
          category: 'electronics',
          categoryName: '未來電子',
          price: 5200,
          rating: 4.8,
          tag: '熱門商品',
          image: 'https://images.unsplash.com/photo-1618384887929-16ec33fab9ef?auto=format&fit=crop&w=600&q=80',
          description: '透明水晶磁軸結構，支援熱插拔與 1680 萬色動態 RGB 響應音效。'
        },
        {
          id: 'p5',
          name: 'Cyberpunk 光感流線夾克',
          category: 'fashion',
          categoryName: '潮流服飾',
          price: 12500,
          rating: 4.6,
          tag: '潮流必備',
          image: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=600&q=80',
          description: '防水防風智慧塗層，內建薄膜溫控系統，可透過手機 App 調整外觀光效。'
        },
        {
          id: 'p6',
          name: 'HoloDeck 可攜式投影儀',
          category: 'gadgets',
          categoryName: '黑科技裝備',
          price: 18200,
          rating: 4.9,
          tag: '極致畫質',
          image: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=80',
          description: '口袋大小的 3D 全息投影單元，支援手勢互動與智慧語音操控。'
        }
      ];

      const categories = [
        { id: 'all', name: '全部裝備' },
        { id: 'gadgets', name: '黑科技裝備' },
        { id: 'cyberwear', name: '賽博穿戴' },
        { id: 'electronics', name: '未來電子' },
        { id: 'fashion', name: '潮流服飾' }
      ];

      // --- Global State ---
      let cart = [];
      let activeCategory = 'all';
      let searchQuery = '';

      // --- DOM Elements ---
      const productGrid = document.getElementById('product-grid');
      const categoryFilters = document.getElementById('category-filters');
      const cartBadge = document.getElementById('cart-badge');
      const cartIconBtn = document.getElementById('cart-icon-btn');
      const cartDrawer = document.getElementById('cart-drawer');
      const cartDrawerBackdrop = document.getElementById('cart-drawer-backdrop');
      const cartItemsContainer = document.getElementById('cart-items-container');
      const cartSubtotalEl = document.getElementById('cart-subtotal');
      const cartTotalEl = document.getElementById('cart-total');
      const toastContainer = document.getElementById('toast-container');
      const searchInput = document.getElementById('search-input');
      const mobileSearchInput = document.getElementById('mobile-search-input');

      // --- Particle System Logic ---
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      class Particle {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.size = Math.random() * 6 + 2;
          this.speedX = (Math.random() - 0.5) * 12;
          this.speedY = (Math.random() - 0.5) * 12;
          this.color = color;
          this.alpha = 1;
          this.decay = Math.random() * 0.03 + 0.015;
          this.gravity = 0.15;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          this.speedY += this.gravity;
          this.alpha -= this.decay;
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = Math.max(0, this.alpha);
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function createParticleExplosion(x, y) {
        const colors = ['#00f3ff', '#ff0055', '#b000ff', '#ffe600', '#ffffff'];
        for (let i = 0; i < 35; i++) {
          const randomColor = colors[Math.floor(Math.random() * colors.length)];
          particles.push(new Particle(x, y, randomColor));
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw();
          if (particles[i].alpha <= 0) {
            particles.splice(i, 1);
          }
        }
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      // --- Flying Ghost / Trail Effect ---
      function triggerFlyingEffect(startElem, targetElem) {
        const startRect = startElem.getBoundingClientRect();
        const targetRect = targetElem.getBoundingClientRect();

        const startX = startRect.left + startRect.width / 2;
        const startY = startRect.top + startRect.height / 2;
        const targetX = targetRect.left + targetRect.width / 2;
        const targetY = targetRect.top + targetRect.height / 2;

        // Create energy ball element
        const ball = document.createElement('div');
        ball.className = 'flying-energy-ball';
        ball.style.width = '24px';
        ball.style.height = '24px';
        ball.style.left = `${startX - 12}px`;
        ball.style.top = `${startY - 12}px`;

        document.body.appendChild(ball);

        // Force Reflow
        ball.getBoundingClientRect();

        // Curved Trajectory via CSS Transform
        const deltaX = targetX - startX;
        const deltaY = targetY - startY;

        ball.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.3)`;
        ball.style.opacity = '0.2';

        setTimeout(() => {
          ball.remove();
          // Cart Wobble Effect
          cartIconBtn.classList.add('animate-cart-bounce');
          cartBadge.classList.add('scale-125');
          
          setTimeout(() => {
            cartIconBtn.classList.remove('animate-cart-bounce');
            cartBadge.classList.remove('scale-125');
          }, 600);
        }, 800);
      }

      // --- Core UI Render Functions ---
      function renderCategories() {
        categoryFilters.innerHTML = categories.map(cat => `
          <button onclick="setCategory('${cat.id}')" 
                  class="px-4 py-2 rounded-full text-xs font-medium tracking-wider transition-all duration-200 border ${
                    activeCategory === cat.id
                      ? 'bg-gradient-to-r from-cyan-500 to-purple-600 text-white border-cyan-400 shadow-lg shadow-cyan-500/20'
                      : 'bg-slate-900/60 text-slate-400 border-slate-800 hover:border-cyan-500/40 hover:text-cyan-400'
                  }">
            ${cat.name}
          </button>
        `).join('');
      }

      function renderProducts() {
        const filtered = products.filter(p => {
          const matchesCategory = activeCategory === 'all' || p.category === activeCategory;
          const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                p.description.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
          productGrid.innerHTML = `
            <div class="col-span-full py-16 text-center text-slate-500">
              <i class="fa-solid fa-ghost text-5xl mb-4 text-slate-700"></i>
              <p class="text-base font-orbitron">未搜尋到匹配的量子裝備</p>
            </div>
          `;
          return;
        }

        productGrid.innerHTML = filtered.map(p => `
          <div class="glass-card rounded-2xl overflow-hidden flex flex-col group">
            <!-- Image Header -->
            <div class="relative h-52 overflow-hidden bg-slate-950/50">
              <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
              <span class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md border border-cyan-500/30 text-cyan-400 text-[10px] font-orbitron px-2.5 py-1 rounded-full">
                ${p.tag}
              </span>
              <button onclick="openModal('${p.id}')" class="absolute bottom-3 right-3 w-9 h-9 rounded-full bg-slate-950/70 border border-slate-700 text-slate-300 hover:text-white hover:border-cyan-400 flex items-center justify-center backdrop-blur-md transition">
                <i class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>

            <!-- Body -->
            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                  <span>${p.categoryName}</span>
                  <span class="text-yellow-400 font-bold flex items-center gap-1">
                    <i class="fa-solid fa-star text-[10px]"></i> ${p.rating}
                  </span>
                </div>
                <h3 class="font-bold text-base text-white hover:text-cyan-400 transition cursor-pointer mb-2 line-clamp-1" onclick="openModal('${p.id}')">
                  ${p.name}
                </h3>
                <p class="text-slate-400 text-xs line-clamp-2 leading-relaxed mb-4">
                  ${p.description}
                </p>
              </div>

              <!-- Price & Add Button -->
              <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between">
                <div>
                  <span class="text-[10px] text-slate-500 block">售價</span>
                  <span class="font-orbitron font-extrabold text-cyan-400 text-lg">NT$ ${p.price.toLocaleString()}</span>
                </div>
                <button onclick="addToCart(event, '${p.id}')" 
                        class="add-btn relative overflow-hidden px-4 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-orbitron font-bold text-xs tracking-wider flex items-center space-x-2 shadow-lg shadow-cyan-500/20 active:scale-95 transition">
                  <i class="fa-solid fa-plus"></i>
                  <span>裝載</span>
                </button>
              </div>
            </div>
          </div>
        `).join('');
      }

      // --- Cart Actions & Animations ---
      function addToCart(event, productId) {
        const btn = event.currentTarget;
        const product = products.find(p => p.id === productId);
        if (!product) return;

        // 1. Button Ripple Glow
        btn.classList.add('btn-pulse');
        setTimeout(() => btn.classList.remove('btn-pulse'), 600);

        // 2. Particle Explosion Burst
        const rect = btn.getBoundingClientRect();
        const burstX = rect.left + rect.width / 2;
        const burstY = rect.top + rect.height / 2;
        createParticleExplosion(burstX, burstY);

        // 3. Flying Trail Effect to Cart Icon
        triggerFlyingEffect(btn, cartIconBtn);

        // 4. Cart State Update
        const existing = cart.find(item => item.id === productId);
        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({ ...product, quantity: 1 });
        }

        updateCartUI();
        showToast(`已成功將 「${product.name}」 加入裝備庫！`);
      }

      function updateCartUI() {
        // Update Badge
        const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartBadge.innerText = totalCount;
        if (totalCount > 0) {
          cartBadge.classList.remove('scale-0');
        } else {
          cartBadge.classList.add('scale-0');
        }

        // Calculate Subtotal & Total
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        cartSubtotalEl.innerText = `NT$ ${subtotal.toLocaleString()}`;
        cartTotalEl.innerText = `NT$ ${subtotal.toLocaleString()}`;

        // Render Items
        if (cart.length === 0) {
          cartItemsContainer.innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-slate-500 py-12">
              <i class="fa-solid fa-box-open text-5xl mb-3 text-slate-700"></i>
              <p class="text-sm font-orbitron">量子儲存倉當前為空</p>
            </div>
          `;
          return;
        }

        cartItemsContainer.innerHTML = cart.map(item => `
          <div class="flex items-center space-x-3 bg-slate-950/60 border border-slate-800 p-3 rounded-2xl relative">
            <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-xl border border-slate-800">
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-bold text-white truncate">${item.name}</h4>
              <span class="text-xs text-cyan-400 font-orbitron block mt-0.5">NT$ ${item.price.toLocaleString()}</span>
              
              <!-- Quantity Control -->
              <div class="flex items-center space-x-2 mt-2">
                <button onclick="updateQuantity('${item.id}', -1)" class="w-6 h-6 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs flex items-center justify-center">-</button>
                <span class="text-xs font-orbitron text-white font-bold px-1">${item.quantity}</span>
                <button onclick="updateQuantity('${item.id}', 1)" class="w-6 h-6 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs flex items-center justify-center">+</button>
              </div>
            </div>
            <button onclick="removeFromCart('${item.id}')" class="text-slate-500 hover:text-rose-400 p-2 text-xs transition">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `).join('');
      }

      function updateQuantity(id, delta) {
        const item = cart.find(i => i.id === id);
        if (!item) return;
        item.quantity += delta;
        if (item.quantity <= 0) {
          removeFromCart(id);
        } else {
          updateCartUI();
        }
      }

      function removeFromCart(id) {
        cart = cart.filter(i => i.id !== id);
        updateCartUI();
      }

      function clearCart() {
        if (cart.length === 0) return;
        cart = [];
        updateCartUI();
        showToast('量子儲存倉已清空！');
      }

      // --- Drawer Toggle ---
      function toggleCartDrawer() {
        const isOpen = !cartDrawer.classList.contains('translate-x-full');
        if (isOpen) {
          cartDrawer.classList.add('translate-x-full');
          cartDrawerBackdrop.classList.add('opacity-0', 'pointer-events-none');
          cartDrawerBackdrop.classList.remove('opacity-100');
        } else {
          cartDrawer.classList.remove('translate-x-full');
          cartDrawerBackdrop.classList.remove('opacity-0', 'pointer-events-none');
          cartDrawerBackdrop.classList.add('opacity-100');
        }
      }

      // --- Quick Modal Preview ---
      function openModal(id) {
        const product = products.find(p => p.id === id);
        if (!product) return;

        const modalBody = document.getElementById('modal-body');
        modalBody.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="rounded-2xl overflow-hidden bg-slate-950 border border-slate-800">
              <img src="${product.image}" class="w-full h-64 md:h-full object-cover">
            </div>
            <div class="flex flex-col justify-between space-y-4">
              <div>
                <span class="text-xs font-orbitron text-cyan-400 border border-cyan-500/30 px-2.5 py-1 rounded-full inline-block mb-3 bg-cyan-500/10">
                  ${product.categoryName}
                </span>
                <h2 class="text-xl font-bold text-white mb-2">${product.name}</h2>
                <div class="flex items-center space-x-2 text-xs text-yellow-400 mb-4">
                  <i class="fa-solid fa-star"></i>
                  <span class="font-bold">${product.rating} / 5.0</span>
                </div>
                <p class="text-slate-400 text-xs leading-relaxed mb-6">
                  ${product.description}
                </p>
              </div>
              <div class="space-y-4 pt-4 border-t border-slate-800">
                <div class="flex justify-between items-center">
                  <span class="text-xs text-slate-500">價格</span>
                  <span class="font-orbitron font-black text-2xl text-cyan-400">NT$ ${product.price.toLocaleString()}</span>
                </div>
                <button onclick="addToCart(event, '${product.id}'); closeModal();" 
                        class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-500 hover:opacity-90 text-white font-orbitron font-bold text-sm tracking-wider shadow-lg shadow-cyan-500/20 transition">
                  裝載至購物車
                </button>
              </div>
            </div>
          </div>
        `;

        const modal = document.getElementById('product-modal');
        const modalContent = document.getElementById('modal-content');
        modal.classList.remove('opacity-0', 'pointer-events-none');
        modalContent.classList.remove('scale-95');
        modalContent.classList.add('scale-100');
      }

      function closeModal() {
        const modal = document.getElementById('product-modal');
        const modalContent = document.getElementById('modal-content');
        modal.classList.add('opacity-0', 'pointer-events-none');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
      }

      // --- Toast Notifications ---
      function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'glass-card text-white text-xs px-4 py-3 rounded-xl flex items-center space-x-3 border border-cyan-500/40 shadow-xl pointer-events-auto transform translate-y-4 opacity-0 transition-all duration-300';
        toast.innerHTML = `
          <div class="w-6 h-6 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center">
            <i class="fa-solid fa-check text-xs"></i>
          </div>
          <span>${msg}</span>
        `;
        toastContainer.appendChild(toast);

        // Animate In
        setTimeout(() => {
          toast.classList.remove('translate-y-4', 'opacity-0');
        }, 50);

        // Remove after timeout
        setTimeout(() => {
          toast.classList.add('translate-y-4', 'opacity-0');
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // --- Category & Filter Handlers ---
      function setCategory(catId) {
        activeCategory = catId;
        renderCategories();
        renderProducts();
      }

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderProducts();
      });

      mobileSearchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderProducts();
      });

      function triggerCheckout() {
        if (cart.length === 0) {
          showToast('請先將商品加入量子儲存倉！');
          return;
        }	
        showToast('🚀 正在連結量子支付通道，感謝訂購！');
        clearCart();
        toggleCartDrawer();
      }

      // Initialize
      renderCategories();
      renderProducts();
      updateCartUI();
    </script>
  </body>
  </html>d
